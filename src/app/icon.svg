<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C" />
      <stop offset="100%" stop-color="#00CC7D" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62828" />
      <stop offset="100%" stop-color="#E84545" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="30" height="30" x="1" y="1" rx="8" fill="#050505" stroke="url(#gradBorder)" stroke-width="2" />
  <text x="16" y="23" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="url(#gradText)" text-anchor="middle" filter="url(#glow)">A</text>
</svg>
